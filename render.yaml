services:
  - type: worker
    name: pokemon-drop-tracker
    runtime: docker
    plan: starter
    autoDeploy: true
    envVars:
      - key: CHECK_INTERVAL_SECONDS
        value: "300"
      - key: CHECK_JITTER_SECONDS
        value: "30"
      - key: MATCH_TERMS
        value: "30th celebration"
      - key: TRACK_ALL_PRODUCTS
        value: "true"
      - key: PRODUCT_TERMS
        value: "elite trainer box,booster bundle,3 pack,three pack,sylveon ex,greninja ex,poster collection,binder collection,mew figure collection,mewtwo figure collection,ditto premium collection"
      - key: DISCOVERY_URLS
        value: "https://www.pokemoncenter.com/category/new-releases,https://www.pokemoncenter.com/category/trading-card-game,https://www.pokemoncenter.com/category/plush,https://www.pokemoncenter.com/category/figures-and-pins"
      - key: DISCORD_WEBHOOK_URL
        sync: false
