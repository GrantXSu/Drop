[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "drop-tracker"
version = "0.1.0"
description = "Polite stock-change notifications for Pokemon Center products"
requires-python = ">=3.9"
dependencies = [
  "beautifulsoup4>=4.12",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
drop-tracker = "drop_tracker.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/drop_tracker"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
