name: Track Pokemon Center drops

on:
  workflow_dispatch:
    inputs:
      send_test_alert:
        description: "Send a test Discord alert instead of checking stock"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: pokemon-drop-tracker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      TARGET_URLS: ${{ vars.TARGET_URLS }}
      DISCOVERY_URLS: >-
        https://www.pokemoncenter.com/category/new-releases,
        https://www.pokemoncenter.com/category/trading-card-game,
        https://www.pokemoncenter.com/category/plush,
        https://www.pokemoncenter.com/category/figures-and-pins
      TRACK_ALL_PRODUCTS: "true"
      MATCH_TERMS: 30th celebration
      PRODUCT_TERMS: >-
        elite trainer box,booster bundle,3 pack,three pack,sylveon ex,
        greninja ex,poster collection,binder collection,mew figure collection,
        mewtwo figure collection,ditto premium collection
      STATE_FILE: data/state.json

    steps:
      - name: Check out tracker
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install tracker
        run: pip install .

      - name: Send test alert
        if: ${{ inputs.send_test_alert }}
        run: drop-tracker --test-notification

      - name: Check product availability
        if: ${{ !inputs.send_test_alert }}
        run: drop-tracker --once

      - name: Save availability state
        if: ${{ !inputs.send_test_alert }}
        run: |
          if [ -f data/state.json ] && [ -n "$(git status --porcelain -- data/state.json)" ]; then
            git add data/state.json
            git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "chore: update drop tracker state"
            git push
          fi
